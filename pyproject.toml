[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sragent-spatial"
version = "0.11.0"
description = "Evidence-preserving GEO spatial metadata lookup and local asset inventory"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
tenx-online = ["playwright>=1.51", "truststore>=0.10; sys_platform == 'win32'"]
validation = ["pillow>=10", "h5py>=3.10"]
visium-hd = ["pillow>=10", "pyarrow>=19,<20", "h5py>=3.10", "scipy>=1.12,<1.18"]
xenium = ["numpy>=1.26.4,<2", "scipy>=1.12,<1.18", "h5py>=3.10", "matplotlib>=3.8", "tifffile>=2024.8", "imagecodecs>=2024.9,<2025"]
agent = ["SRAgent @ git+https://github.com/ArcInstitute/SRAgent.git@67b60c24a49385d3eed8e5121be58d13c82839cd", "truststore>=0.10; sys_platform == 'win32'"]

[project.scripts]
sragent-spatial = "sragent_spatial.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sragent_spatial = ["agent_settings.yml"]
